[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "documentation-pipeline"
version = "0.1.0"
description = "Adopt centralized repo_docs builds and GitLab Pages with Copier"
requires-python = ">=3.11"
dependencies = ["copier==9.19.1", "ruamel.yaml==0.18.17", "tomlkit==0.13.3"]

[project.scripts]
docs-onboard = "documentation_pipeline.onboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
