stages: [test]

validate:
  stage: test
  image: ubuntu:24.04
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv git curl ca-certificates
    - python3 -m venv .venv
    - .venv/bin/pip install -e '.[test]'
  script:
    - DOCS_BUILD_INTEGRATION=1 .venv/bin/pytest -q
